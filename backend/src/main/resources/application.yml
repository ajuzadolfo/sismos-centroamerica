server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: sismos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sismos_db}
    username: ${SPRING_DATASOURCE_USERNAME:sismos_app}
    password: ${SPRING_DATASOURCE_PASSWORD:sismos_dev_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cloud:
    gcp:
      project-id: ${PROJECT_ID:sismos-centroamerica-prod}
      bigquery:
        enabled: ${SPRING_CLOUD_GCP_BIGQUERY_ENABLED:true}
      pubsub:
        enabled: ${SPRING_CLOUD_GCP_PUBSUB_ENABLED:true}

# Configuración del cuadrante de monitorización sísmica en Centroamérica
sismos:
  region:
    min-latitude: 7.0
    max-latitude: 18.5
    min-longitude: -93.0
    max-longitude: -77.0
  ingestion:
    cron-rate-ms: 60000 # Cada 60 segundos
    usgs-cdn-url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
    usgs-fdsn-base-url: "https://earthquake.usgs.gov/fdsnws/event/1/query"

