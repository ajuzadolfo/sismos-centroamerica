<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fondo Espacial Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Resplandor del Epicentro Sísmico -->
    <radialGradient id="epicenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd600" />
      <stop offset="100%" stop-color="#ff9100" />
    </radialGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor Base con Borde Neón -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Ondas de Choque Concéntricas (Onda P y S) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.25" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ffd600" stroke-width="1.8" stroke-dasharray="5 3" stroke-opacity="0.75" />
  <circle cx="32" cy="32" r="11" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Resplandor Difuso Central -->
  <circle cx="32" cy="32" r="12" fill="url(#epicenterGlow)" opacity="0.6" />

  <!-- Traza Sísmica Dinámica (Sismograma / Sismógrafo de Onda) -->
  <path d="M 8 32 L 18 32 L 22 25 L 26 43 L 30 14 L 34 50 L 38 23 L 42 38 L 46 32 L 56 32"
        fill="none"
        stroke="#00f0ff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Traza de Brillo Superior -->
  <path d="M 8 32 L 18 32 L 22 25 L 26 43 L 30 14 L 34 50 L 38 23 L 42 38 L 46 32 L 56 32"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- Núcleo Brillante del Epicentro -->
  <circle cx="32" cy="32" r="4" fill="url(#corePulse)" />
  <circle cx="32" cy="32" r="1.8" fill="#ffffff" />
</svg>
