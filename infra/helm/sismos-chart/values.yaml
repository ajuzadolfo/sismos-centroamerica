# values.yaml - Configuración de despliegue multi-cloud en Kubernetes (GKE, EKS, AKS o On-Premise)

global:
  environment: production
  domain: sismos.foznasolutions.com

backend:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/sismos-centroamerica-prod/sismos-repo/sismos-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  env:
    SPRING_PROFILES_ACTIVE: prod
    DB_HOST: "10.0.0.3"
    DB_PORT: "5432"
    DB_NAME: "sismos_db"
    DB_USER: "sismos_app"
  livenessProbe:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 5

frontend:
  replicaCount: 2
  image:
    repository: us-central1-docker.pkg.dev/sismos-centroamerica-prod/sismos-repo/sismos-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sismos-backend"
  hosts:
    - host: sismos.foznasolutions.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /ws
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: sismos-tls-cert
      hosts:
        - sismos.foznasolutions.com
