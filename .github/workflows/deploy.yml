name: CI/CD Pipeline - Despliegue en Google Cloud Run

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Fase 1: Control de concurrencia para cancelar builds obsoletos en ramas de desarrollo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  id-token: write # Requerido para Workload Identity Federation (OIDC)

env:
  REGION: us-central1
  BACKEND_SERVICE: sismos-backend
  FRONTEND_SERVICE: sismos-frontend
  VPC_NETWORK: sismos-vpc
  VPC_SUBNET: cloudrun-subnet

  # Variables dinámicas según la rama (main = PRODUCCIÓN, develop = TEST)
  PROJECT_ID: ${{ github.ref_name == 'main' && 'sismos-centroamerica-prod' || 'sismos-centroamerica-test' }}
  ARTIFACT_REPO: us-central1-docker.pkg.dev/${{ github.ref_name == 'main' && 'sismos-centroamerica-prod' || 'sismos-centroamerica-test' }}/sismos-repo
  CLOUD_SQL_INSTANCE: ${{ github.ref_name == 'main' && 'sismos-centroamerica-prod:us-central1:sismos-pg-test' || 'sismos-centroamerica-test:us-central1:sismos-pg-test' }}
  WIF_PROVIDER: ${{ github.ref_name == 'main' && 'projects/26325234019/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' || 'projects/1092009103926/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' }}
  WIF_SERVICE_ACCOUNT: github-deployer@${{ github.ref_name == 'main' && 'sismos-centroamerica-prod' || 'sismos-centroamerica-test' }}.iam.gserviceaccount.com

jobs:

  # =====================================================================
  # JOB 1A: Pruebas Unitarias, Cobertura y Seguridad Backend (Java 21)
  # =====================================================================
  test-backend:
    name: Pruebas Backend y Seguridad (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - Escaneo de Fuga de Secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python para SQLFluff
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar Sintaxis de Migraciones Flyway (SQLFluff)
        run: |
          pip install sqlfluff
          sqlfluff parse backend/src/main/resources/db/migration/

      - name: Revisión de Seguridad de Dependencias (CVEs)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias de Spring Boot y Cobertura JaCoCo
        run: |
          cd backend
          mvn clean test jacoco:report -B

      - name: Publicar Reporte de Cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

  # =====================================================================
  # JOB 1B: Calidad, Linting y Compilación Frontend en Paralelo (Angular 18)
  # =====================================================================
  test-frontend:
    name: Linting y Compilación Frontend (Angular 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm ci

      - name: Análisis Estático de Código Frontend (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Compilar Frontend Angular
        run: |
          cd frontend
          npm run build

  # =====================================================================
  # JOB 1: Guardián de Calidad Inmutable (Satisface Branch Protection de main)
  # =====================================================================
  test:
    name: Pruebas Unitarias (Backend y Frontend)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verificación exitosa de jobs paralelos
        run: echo "✅ Todas las pruebas unitarias y análisis de calidad pasaron exitosamente en paralelo."

  # =====================================================================
  # JOB 2: Build, Push y Despliegue Serverless en Cloud Run
  # =====================================================================
  deploy:
    name: Build y Despliegue en Cloud Run
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'test' }}
      url: ${{ github.ref_name == 'main' && 'https://sismos.foznasolutions.com' || steps.frontend_deploy.outputs.url }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. Autenticación OIDC con GCP sin claves JSON permanentes
      - name: Autenticación en Google Cloud vía WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 2. Configurar Docker Buildx y Auth para Artifact Registry
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar Docker Auth para Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Construir y Publicar Imagen del Backend con Buildx y Cache GHA
      - name: Build y Push Docker - Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
            ${{ env.ARTIFACT_REPO }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Obtener IP privada de Cloud SQL y Desplegar Backend con Secretos Nativos
      - name: Desplegar Backend en Cloud Run con Direct VPC Egress
        run: |
          DB_IP=$(gcloud sql instances describe sismos-pg-test --project=${{ env.PROJECT_ID }} --format=json | jq -r '.ipAddresses[]? | select(.type=="PRIVATE") | .ipAddress' | head -n1)
          if [ -z "$DB_IP" ] || [ "$DB_IP" = "null" ]; then
            DB_IP=$(gcloud sql instances describe sismos-pg-test --project=${{ env.PROJECT_ID }} --format=json | jq -r '.ipAddresses[]? | select(.type=="PRIMARY") | .ipAddress' | head -n1)
          fi
          DB_PASS=$(gcloud secrets versions access latest --secret=db-password --project=${{ env.PROJECT_ID }})
          echo "Conectando backend a BD en IP: $DB_IP (Proyecto: ${{ env.PROJECT_ID }})"

          # Limpiar cualquier referencia previa a secretos vinculados para permitir actualizar a variable de entorno
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --clear-secrets \
            --quiet || true

          SECRETS_LIST=()
          if gcloud secrets describe gemini-api-key --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Secreto gemini-api-key detectado en Secret Manager. Inyectando en Cloud Run..."
            SECRETS_LIST+=("GEMINI_API_KEY=gemini-api-key:latest")
          else
            echo "Secreto gemini-api-key no presente. Operando con generador geocientífico de respaldo."
          fi

          if gcloud secrets describe vapid-private-key --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1 && \
             gcloud secrets describe vapid-public-key  --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Secretos VAPID detectados en Secret Manager. Inyectando en Cloud Run..."
            SECRETS_LIST+=("VAPID_PUBLIC_KEY=vapid-public-key:latest" "VAPID_PRIVATE_KEY=vapid-private-key:latest")
          else
            echo "Secretos VAPID no presentes en Secret Manager."
          fi

          SECRETS_ARG=""
          if [ ${#SECRETS_LIST[@]} -gt 0 ]; then
            IFS=','
            SECRETS_ARG="--set-secrets=${SECRETS_LIST[*]}"
            unset IFS
          fi

          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --project="${{ env.PROJECT_ID }}" \
            --image="${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=1Gi \
            --min-instances=1 \
            --max-instances=3 \
            --timeout=3600 \
            --no-cpu-throttling \
            --network="${{ env.VPC_NETWORK }}" \
            --subnet="${{ env.VPC_SUBNET }}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_IP}:5432/sismos_db,SPRING_DATASOURCE_USERNAME=sismos_app,SPRING_DATASOURCE_PASSWORD=${DB_PASS},SPRING_CLOUD_GCP_BIGQUERY_ENABLED=true,SPRING_CLOUD_GCP_PUBSUB_ENABLED=true,PROJECT_ID=${{ env.PROJECT_ID }}" \
            $SECRETS_ARG \
            --quiet

      # 5. Obtener URL pública del Backend
      - name: Obtener URL pública del Backend
        id: backend_url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --project="${{ env.PROJECT_ID }}" --region="${{ env.REGION }}" --format='value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"

      # 6. Configurar Endpoints del Backend y Construir Imagen del Frontend con Buildx
      - name: Configurar Endpoints en Frontend
        run: |
          BACKEND_URL="${{ steps.backend_url.outputs.url }}"
          WS_URL=$(echo "$BACKEND_URL" | sed 's|^https|wss|; s|^http|ws|')
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            BACKEND_URL="https://api-sismos.foznasolutions.com"
            WS_URL="wss://api-sismos.foznasolutions.com"
            sed -i -E "s|production: false|production: true|g" frontend/src/environments/environment.ts
            sed -i -E "s|isTest: true|isTest: false|g" frontend/src/environments/environment.ts
          fi
          
          echo "Configurando Frontend para conectar a: $BACKEND_URL"
          sed -i -E "s|apiUrl: '[^']*'|apiUrl: '${BACKEND_URL}/api/v1'|g" frontend/src/environments/environment.ts
          sed -i -E "s|wsUrl: '[^']*'|wsUrl: '${WS_URL}/ws/seismic'|g" frontend/src/environments/environment.ts

      - name: Build y Push Docker - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
            ${{ env.ARTIFACT_REPO }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Desplegar Frontend en Cloud Run
      - name: Desplegar Frontend en Cloud Run
        id: frontend_deploy
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --project="${{ env.PROJECT_ID }}" \
            --image="${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=1 \
            --max-instances=3 \
            --quiet
          
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --project="${{ env.PROJECT_ID }}" --region="${{ env.REGION }}" --format='value(status.url)')
          echo "url=$FRONTEND_URL" >> $GITHUB_OUTPUT

      # 8. Resumen de Despliegue con URLs Públicas
      - name: Publicar URLs en GitHub Summary
        run: |
          BRANCH="${{ github.ref_name }}"
          ENV_LABEL="TEST"
          FRONTEND_URL="${{ steps.frontend_deploy.outputs.url }}"
          BACKEND_URL="${{ steps.backend_url.outputs.url }}"
          
          if [ "$BRANCH" = "main" ]; then
            ENV_LABEL="PRODUCCIÓN"
            FRONTEND_URL="https://sismos.foznasolutions.com (Directa: ${{ steps.frontend_deploy.outputs.url }})"
            BACKEND_URL="https://api-sismos.foznasolutions.com (Directa: ${{ steps.backend_url.outputs.url }})"
          fi
          
          echo "### 🚀 Despliegue en Google Cloud Run Completado ($ENV_LABEL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Entorno:** \`$ENV_LABEL\` (Proyecto: \`${{ env.PROJECT_ID }}\`, Rama: \`$BRANCH\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Web (MapLibre GL / Angular 18):** $FRONTEND_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API REST / WebSockets:** $BACKEND_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de Datos:** Cloud SQL PostgreSQL 16 con PostGIS (Direct VPC Egress)" >> $GITHUB_STEP_SUMMARY
          echo "- **Seguridad:** Autenticación OIDC vía WIF (Cero Claves JSON)" >> $GITHUB_STEP_SUMMARY

      # 9. Notificación por Correo tras Despliegue en TEST
      - name: Notificar Despliegue en TEST por Correo
        if: success() && github.ref_name == 'develop'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚀 [Sismos CA] Despliegue en TEST Completado"
          to: ${{ secrets.GMAIL_TO || secrets.GMAIL_USERNAME }}
          from: "Sismos Centroamérica CI/CD <${{ secrets.GMAIL_USERNAME }}>"
          body: |
            🌋 Sismos Centroamérica - Despliegue en TEST Completado
            
            El despliegue automático en el entorno de TEST se ha completado con éxito en Google Cloud Run.
            
            URL de la Aplicación en Test:
            ${{ steps.frontend_deploy.outputs.url }}
            
            Detalles del Despliegue:
            - Rama: develop
            - Commit: ${{ github.sha }}
            - Mensaje: ${{ github.event.head_commit.message }}
            - Backend API: ${{ steps.backend_url.outputs.url }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 24px; margin: 0; }
                .card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
                .header { border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; }
                .title { font-size: 20px; font-weight: 700; color: #38bdf8; margin: 0; }
                .badge { display: inline-block; background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-top: 8px; }
                .url-box { background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 8px; padding: 16px; margin: 18px 0; text-align: center; }
                .btn { display: inline-block; background: #00f0ff; color: #040914 !important; font-weight: 700; text-decoration: none; padding: 10px 22px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
                .meta-table { width: 100%; font-size: 13px; color: #94a3b8; border-collapse: collapse; margin-top: 16px; }
                .meta-table td { padding: 6px 0; }
                .meta-table td.label { width: 120px; color: #64748b; font-weight: 600; }
                .footer { font-size: 11px; color: #475569; text-align: center; margin-top: 24px; border-top: 1px solid #1e293b; padding-top: 12px; }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="header">
                  <h1 class="title">🌋 Sismos Centroamérica</h1>
                  <span class="badge">TEST ENVIRONMENT (sismos-centroamerica-test)</span>
                </div>
                <p>El despliegue automático en el entorno de <strong>TEST</strong> se ha completado con éxito en Google Cloud Run.</p>
                <div class="url-box">
                  <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">URL de la Aplicación en Test:</div>
                  <a href="${{ steps.frontend_deploy.outputs.url }}" style="font-size: 15px; font-weight: 700; color: #38bdf8; word-break: break-all;">${{ steps.frontend_deploy.outputs.url }}</a>
                  <br>
                  <a href="${{ steps.frontend_deploy.outputs.url }}" class="btn">Abrir Consola de Pruebas →</a>
                </div>
                <table class="meta-table">
                  <tr><td class="label">Rama:</td><td><code>develop</code></td></tr>
                  <tr><td class="label">Commit SHA:</td><td><code>${{ github.sha }}</code></td></tr>
                  <tr><td class="label">Mensaje:</td><td>${{ github.event.head_commit.message }}</td></tr>
                  <tr><td class="label">Backend API:</td><td><a href="${{ steps.backend_url.outputs.url }}" style="color: #94a3b8;">${{ steps.backend_url.outputs.url }}</a></td></tr>
                </table>
                <div class="footer">
                  Plataforma de Monitorización Sísmica · Fozna Solutions · Cloud Run us-central1
                </div>
              </div>
            </body>
            </html>
