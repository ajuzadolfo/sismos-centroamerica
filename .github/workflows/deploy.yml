name: CI/CD Pipeline - Despliegue en Google Cloud Run

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Requerido para Workload Identity Federation (OIDC)

env:
  REGION: us-central1
  # Por defecto el proyecto base es TEST; en 'main' se puede sobreescribir con PROD_PROJECT_ID si existe
  PROJECT_ID: sismos-centroamerica-test
  ARTIFACT_REPO: us-central1-docker.pkg.dev/sismos-centroamerica-test/sismos-repo
  BACKEND_SERVICE: sismos-backend
  FRONTEND_SERVICE: sismos-frontend
  VPC_NETWORK: sismos-vpc
  VPC_SUBNET: cloudrun-subnet
  CLOUD_SQL_INSTANCE: sismos-centroamerica-test:us-central1:sismos-pg-test
  WIF_PROVIDER: projects/1092009103926/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  WIF_SERVICE_ACCOUNT: github-deployer@sismos-centroamerica-test.iam.gserviceaccount.com

jobs:

  # =====================================================================
  # JOB 1: Test y Verificación de Calidad
  # =====================================================================
  test:
    name: Pruebas Unitarias (Backend y Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias de Spring Boot
        run: |
          cd backend
          mvn test -B

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y compilar Angular
        run: |
          cd frontend
          npm ci
          npm run build

  # ==========================================
  # JOB 2: Build, Push y Despliegue Serverless en Cloud Run
  # ==========================================
  deploy:
    name: Build y Despliegue en Cloud Run
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. Autenticación OIDC con GCP sin claves JSON permanentes
      - name: Autenticación en Google Cloud vía WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 2. Configurar Docker para Artifact Registry
      - name: Configurar Docker Auth para Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Construir y Publicar Imagen del Backend
      - name: Build y Push Docker - Backend
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          LATEST_TAG="${{ env.ARTIFACT_REPO }}/backend:latest"
          
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./backend
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      # 4. Obtener IP privada de Cloud SQL y Desplegar Backend en Cloud Run
      - name: Desplegar Backend en Cloud Run con Direct VPC Egress
        run: |
          DB_IP=$(gcloud sql instances describe sismos-pg-test --format=json | jq -r '.ipAddresses[]? | select(.type=="PRIVATE") | .ipAddress' | head -n1)
          if [ -z "$DB_IP" ] || [ "$DB_IP" = "null" ]; then
            DB_IP=$(gcloud sql instances describe sismos-pg-test --format=json | jq -r '.ipAddresses[]? | select(.type=="PRIMARY") | .ipAddress' | head -n1)
          fi
          DB_PASS=$(gcloud secrets versions access latest --secret=db-password)
          echo "Conectando backend a BD en IP: $DB_IP"

          
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image="${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=1Gi \
            --min-instances=1 \
            --max-instances=3 \
            --timeout=3600 \
            --no-cpu-throttling \
            --network="${{ env.VPC_NETWORK }}" \
            --subnet="${{ env.VPC_SUBNET }}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_IP}:5432/sismos_db,SPRING_DATASOURCE_USERNAME=sismos_app,SPRING_DATASOURCE_PASSWORD=${DB_PASS}" \
            --quiet

      # 5. Obtener URL pública del Backend
      - name: Obtener URL pública del Backend
        id: backend_url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region="${{ env.REGION }}" --format='value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"

      # 6. Configurar Endpoints del Backend y Construir Imagen del Frontend
      - name: Build y Push Docker - Frontend
        run: |
          BACKEND_URL="${{ steps.backend_url.outputs.url }}"
          WS_URL=$(echo "$BACKEND_URL" | sed 's|^https|wss|; s|^http|ws|')
          
          echo "Configurando Frontend para conectar a: $BACKEND_URL"
          sed -i "s|http://localhost:8080/api/v1|${BACKEND_URL}/api/v1|g" frontend/src/environments/environment.ts
          sed -i "s|http://localhost:8080/ws/seismic|${WS_URL}/ws/seismic|g" frontend/src/environments/environment.ts
          
          IMAGE_TAG="${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}"
          LATEST_TAG="${{ env.ARTIFACT_REPO }}/frontend:latest"
          
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./frontend
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      # 7. Desplegar Frontend en Cloud Run
      - name: Desplegar Frontend en Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image="${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=1 \
            --max-instances=3 \
            --quiet

      # 8. Resumen de Despliegue con URLs Públicas
      - name: Publicar URLs en GitHub Summary
        run: |
          BRANCH="${{ github.ref_name }}"
          ENV_LABEL="TEST"
          if [ "$BRANCH" = "main" ]; then
            ENV_LABEL="PRODUCCIÓN"
          fi
          
          BACKEND_URL="${{ steps.backend_url.outputs.url }}"
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region="${{ env.REGION }}" --format='value(status.url)')
          
          echo "### 🚀 Despliegue en Google Cloud Run Completado ($ENV_LABEL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Entorno:** \`$ENV_LABEL\` (Rama: \`$BRANCH\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Web (MapLibre GL / Angular 18):** $FRONTEND_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API REST / WebSockets:** $BACKEND_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de Datos:** Cloud SQL PostgreSQL 16 con PostGIS (Direct VPC Egress)" >> $GITHUB_STEP_SUMMARY


